<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Just MLBB, aau!</title>
<style>
:root{--bg:#0b1a1f;--fg:#e8f6f4;--accent:#ffcc4d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b1a1f;--fg:#e8f6f4;--accent:#ffcc4d}}
:root[data-theme="dark"]{--bg:#0b1a1f;--fg:#e8f6f4;--accent:#ffcc4d}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{max-width:560px;width:100%;text-align:center}
img{max-width:100%;border-radius:16px;border:2px solid var(--accent);box-shadow:0 8px 30px rgba(0,0,0,.5)}
h1{font-size:2.4rem;margin:22px 0 6px;color:var(--accent);letter-spacing:.5px}
p{font-size:1.2rem;margin:0;opacity:.9}
body{overflow-x:hidden;background:linear-gradient(135deg,#0b1a1f,#12303a,#2a0f1a,#0b1a1f);background-size:300% 300%;animation:bg 12s ease infinite}
.card{position:relative;animation:pop .8s cubic-bezier(.2,1.4,.4,1) both}
img{animation:float 4s ease-in-out infinite,glow 2.5s ease-in-out infinite}
h1{animation:slide .8s .3s both,shake 3s 1.5s infinite}
.slogan{font-size:1.5rem;font-weight:700;animation:slide .8s .6s both}
.defeat{display:inline-block;color:#ff4d5e;text-shadow:0 0 12px rgba(255,77,94,.7);animation:pulse 1.2s ease-in-out infinite}
.sparks i{position:absolute;bottom:-10px;font-style:normal;font-size:1.6rem;opacity:0;animation:rise 5s linear infinite}
.sparks i:nth-child(1){left:5%;animation-delay:0s}.sparks i:nth-child(2){left:22%;animation-delay:1.2s}.sparks i:nth-child(3){left:40%;animation-delay:2.4s}.sparks i:nth-child(4){left:58%;animation-delay:.6s}.sparks i:nth-child(5){left:76%;animation-delay:1.8s}.sparks i:nth-child(6){left:92%;animation-delay:3s}
@keyframes bg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes glow{0%,100%{box-shadow:0 8px 30px rgba(0,0,0,.5),0 0 0 rgba(255,204,77,0)}50%{box-shadow:0 8px 30px rgba(0,0,0,.5),0 0 28px rgba(255,204,77,.7)}}
@keyframes slide{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes shake{0%,90%,100%{transform:none}92%{transform:translateX(-4px) rotate(-1deg)}94%{transform:translateX(4px) rotate(1deg)}96%{transform:translateX(-3px)}98%{transform:translateX(3px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes rise{0%{opacity:0;transform:translateY(0) rotate(0)}15%{opacity:.9}100%{opacity:0;transform:translateY(-420px) rotate(25deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
h1{background:linear-gradient(90deg,#ffcc4d,#fff,#ff4d5e,#ffcc4d);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:slide .8s .3s both,shake 3s 1.5s infinite,shimmer 3s linear infinite}
img{animation:floattilt 6s ease-in-out infinite,glow 2.5s ease-in-out infinite,hue 8s linear infinite}
body::before,body::after{content:"";position:fixed;width:260px;height:260px;border-radius:50%;filter:blur(70px);opacity:.35;z-index:-1}
body::before{background:#ffcc4d;top:5%;left:-60px;animation:orb1 9s ease-in-out infinite}
body::after{background:#ff4d5e;bottom:5%;right:-60px;animation:orb2 11s ease-in-out infinite}
.counter{display:inline-block;margin-top:18px;padding:8px 18px;border:2px solid #ff4d5e;border-radius:999px;font-weight:800;color:#ff4d5e;letter-spacing:1px;animation:slide .8s .9s both}
.counter.hit{animation:hit .4s}
.tap{margin-top:12px;font-size:.95rem;opacity:.7;animation:blink 1.6s ease-in-out infinite}
.burst{position:fixed;pointer-events:none;font-size:1.6rem;margin:-12px 0 0 -12px;z-index:5;opacity:1;transition:transform .9s ease-out,opacity .9s ease-out}
@keyframes shimmer{to{background-position:300% 0}}
@keyframes floattilt{0%,100%{transform:translateY(0) rotate(-1.5deg) scale(1)}50%{transform:translateY(-12px) rotate(1.5deg) scale(1.03)}}
@keyframes hue{0%,100%{filter:hue-rotate(0)}50%{filter:hue-rotate(25deg) saturate(1.2)}}
@keyframes orb1{0%,100%{transform:translate(0,0)}50%{transform:translate(120px,180px)}}
@keyframes orb2{0%,100%{transform:translate(0,0)}50%{transform:translate(-120px,-160px)}}
@keyframes hit{0%{transform:scale(1)}40%{transform:scale(1.25) rotate(-3deg);box-shadow:0 0 22px rgba(255,77,94,.8)}100%{transform:scale(1)}}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:.9}}
.badge{display:block;margin:10px auto 0;animation:slide .8s .1s both,glowb 2.2s ease-in-out infinite}
.wings{transform-origin:100px 74px;animation:flap 1.8s ease-in-out infinite}
.gem{animation:gem 1.8s ease-in-out infinite}
.rank{font-weight:900;font-size:1.3rem;letter-spacing:8px;text-indent:8px;margin-top:2px;background:linear-gradient(90deg,#ffcc4d,#fff,#ff4d5e,#ffcc4d);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:slide .8s .2s both,shimmer 3s linear infinite}
@keyframes glowb{0%,100%{filter:drop-shadow(0 0 5px #ff4d5e)}50%{filter:drop-shadow(0 0 18px #ffcc4d)}}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.12) translateY(-3px)}}
@keyframes gem{0%,100%{opacity:1}50%{opacity:.7}}
.mute{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:10;width:42px;height:42px;border-radius:50%;border:2px solid #ffcc4d;background:rgba(0,0,0,.45);color:#fff;font-size:1.2rem;cursor:pointer}
.start{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(6,14,18,.94);color:#ffcc4d;font-size:2rem;font-weight:900;letter-spacing:3px;text-align:center;transition:opacity .4s}
.start small{display:block;margin-top:10px;font-size:1rem;color:#fff;opacity:.8;letter-spacing:1px}
.start>div{animation:pulse 1.2s ease-in-out infinite}
.start.gone{opacity:0;pointer-events:none}
